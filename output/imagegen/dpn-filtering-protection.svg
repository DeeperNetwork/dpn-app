<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">Ad filtering. Safer connections.</title>
<desc id="desc">DPN filters supported advertising, tracking and malicious connections. Unwanted traffic stops at a filtering barrier while video, music and web content remain accessible.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f9fafb"/><stop offset="1" stop-color="#eff6ff"/></linearGradient>
  <symbol id="stop" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs>
<rect width="1536" height="1024" fill="url(#bg)"/>
<ellipse cx="765" cy="530" rx="340" ry="330" fill="#dbeafe" opacity=".3"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="768" y="112" text-anchor="middle" font-size="64" font-weight="700" fill="#172554">Ad filtering. Safer connections.</text>
<text x="768" y="162" text-anchor="middle" font-size="22" fill="#64748b">Less interruption. More immersion.</text>

<!-- Unwanted traffic terminates visibly at the barrier. -->
<g fill="#fff" stroke="#e5e7eb" stroke-width="2">
<rect x="80" y="295" width="300" height="110" rx="18"/>
<rect x="80" y="475" width="300" height="110" rx="18"/>
<rect x="80" y="655" width="300" height="110" rx="18"/>
</g>
<g fill="#fef2f2"><rect x="104" y="318" width="64" height="64" rx="16"/><rect x="104" y="498" width="64" height="64" rx="16"/><rect x="104" y="678" width="64" height="64" rx="16"/></g>
<!-- Generic advertising, tracking and warning icons. -->
<g fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
<path d="M119 341h12l22-10v38l-22-10h-12zM125 359l5 13h9l-5-12"/>
<path d="M114 530q22-28 44 0-22 28-44 0Z"/><circle cx="136" cy="530" r="7"/>
<path d="m136 690 23 39h-46zM136 704v10M136 721v1"/>
</g>
<g fill="#1f2937" font-size="23" font-weight="600">
<text x="190" y="359">Ads</text><text x="190" y="539">Trackers</text><text x="190" y="719">Malicious sites</text>
</g>
<g fill="none" stroke="#fca5a5" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 12">
<path d="M380 350h180"/><path d="M380 530h180"/><path d="M380 710h180"/>
</g>
<path d="M590 280v500" stroke="#bfdbfe" stroke-width="4" stroke-linecap="round"/>
<use href="#stop" x="572" y="332" width="36" height="36"/><use href="#stop" x="572" y="512" width="36" height="36"/><use href="#stop" x="572" y="692" width="36" height="36"/>
<text x="590" y="825" text-anchor="middle" font-size="18" fill="#64748b">Unwanted traffic blocked</text>

<!-- DPN's original vector logo, unchanged, inside a protection shield. -->
