name: Sync DPN release

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-dpn-release
  cancel-in-progress: false

jobs:
  mirror:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the mirror
        run: python3 -m unittest discover -s tests -v
      - name: Compare the official catalog and publish changed installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/mirror_downloads.py --repository "$GITHUB_REPOSITORY" --sync --publish
      - name: Download and verify the published files
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          mkdir "$RUNNER_TEMP/verified-release"
          cd "$RUNNER_TEMP/verified-release"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'DPN-*' --pattern SHA256SUMS.txt
          sha256sum --strict --check SHA256SUMS.txt
          printf 'Verified the published installers in `%s`.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
